name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails when dist/ or the docs' generated tables are out of date, or the
      # docs miss a constant or field (tests/docs.test.cjs).
      - run: npm test
